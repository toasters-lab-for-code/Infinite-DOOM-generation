<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Procedural DOOM</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000; font-family: monospace;
            touch-action: none;
        }
        #canvas {
            display: block; width: 100vw; height: 100vh; image-rendering: pixelated;
        }
        .touch-btn {
            position: absolute; background: rgba(255,0,0,0.3); border: 2px solid rgba(255,0,0,0.6);
            color: white; font-weight: bold; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; user-select: none;
            font-size: 20px; z-index: 10;
        }
        #btn-up { bottom: 130px; left: 80px; width: 70px; height: 70px; }
        #btn-down { bottom: 30px; left: 80px; width: 70px; height: 70px; }
        #btn-left { bottom: 80px; left: 20px; width: 60px; height: 60px; }
        #btn-right { bottom: 80px; left: 150px; width: 60px; height: 60px; }
        
        #btn-rot-left { bottom: 80px; right: 140px; width: 70px; height: 70px; border-radius: 10px; background: rgba(0,0,255,0.3); border-color: rgba(0,0,255,0.6); }
        #btn-rot-right { bottom: 80px; right: 40px; width: 70px; height: 70px; border-radius: 10px; background: rgba(0,0,255,0.3); border-color: rgba(0,0,255,0.6); }
        
        #hud {
            position: absolute; top: 10px; left: 10px; color: #00ff00; font-size: 14px; z-index: 10;
            background: rgba(0,0,0,0.7); padding: 5px 10px; border: 1px solid #00ff00;
        }
    </style>
</head>
<body>
    <div id="hud">CHUNK: 0, 0</div>
    <canvas id="canvas"></canvas>

    <div class="touch-btn" id="btn-up">▲</div>
    <div class="touch-btn" id="btn-down">▼</div>
    <div class="touch-btn" id="btn-left">◀</div>
    <div class="touch-btn" id="btn-right">▶</div>
    <div class="touch-btn" id="btn-rot-left">↶</div>
    <div class="touch-btn" id="btn-rot-right">↷</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Internal low-res rendering size for retro look
        const SCREEN_WIDTH = 320;
        const SCREEN_HEIGHT = 200;
        canvas.width = SCREEN_WIDTH;
        canvas.height = SCREEN_HEIGHT;

        const CHUNK_SIZE = 8;
        const TILE_SIZE = 64;
        let player = { x: 250, y: 250, angle: 0 };

        const FOV = Math.PI / 3;
        const NUM_RAYS = SCREEN_WIDTH;
        const MAX_DEPTH = 800;

        let chunks = {};
        let keys = { w: false, s: false, a: false, d: false, rotL: false, rotR: false };

        function getChunkKey(tx, ty) {
            return `${Math.floor(tx / CHUNK_SIZE)},${Math.floor(ty / CHUNK_SIZE)}`;
        }

        function getTile(tileX, tileY) {
            let cx = Math.floor(tileX / CHUNK_SIZE);
            let cy = Math.floor(tileY / CHUNK_SIZE);
            let lx = ((tileX % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
            let ly = ((tileY % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;

            let key = `${cx},${cy}`;
            if (!chunks[key]) {
                let chunk = [];
                for (let y = 0; y < CHUNK_SIZE; y++) {
                    let row = [];
                    for (let x = 0; x < CHUNK_SIZE; x++) {
                        if (x === 0 || x === CHUNK_SIZE - 1 || y === 0 || y === CHUNK_SIZE - 1) {
                            row.push(0);
                        } else {
                            row.push(Math.random() < 0.25 ? 1 : 0);
                        }
                    }
                    chunk.push(row);
                }
                chunks[key] = chunk;
            }
            return chunks[key][ly][lx];
        }

        function updateChunks() {
            let p_cx = Math.floor(player.x / (CHUNK_SIZE * TILE_SIZE));
            let p_cy = Math.floor(player.y / (CHUNK_SIZE * TILE_SIZE));
            
            document.getElementById('hud').innerText = `CHUNK: ${p_cx}, ${p_cy}`;

            for (let key in chunks) {
                let [cx, cy] = key.split(',').map(Number);
                if (Math.abs(cx - p_cx) > 1 || Math.abs(cy - p_cy) > 1) {
                    delete chunks[key]; // Delete unloaded chunk (re-randomizes on return)
                }
            }
        }

        function update() {
            let moveSpeed = 2.5;
            let rotSpeed = 0.04;

            if (keys.rotL || keys.a) player.angle -= rotSpeed;
            if (keys.rotR || keys.d) player.angle += rotSpeed;

            let dx = Math.cos(player.angle) * moveSpeed;
            let dy = Math.sin(player.angle) * moveSpeed;

            let nextX = player.x;
            let nextY = player.y;

            if (keys.w) { nextX += dx; nextY += dy; }
            if (keys.s) { nextX -= dx; nextY -= dy; }

            // Collision check
            if (getTile(Math.floor(nextX / TILE_SIZE), Math.floor(player.y / TILE_SIZE)) === 0) player.x = nextX;
            if (getTile(Math.floor(player.x / TILE_SIZE), Math.floor(nextY / TILE_SIZE)) === 0) player.y = nextY;

            updateChunks();
        }

        function render() {
            // Draw ceiling & floor
            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT / 2);
            ctx.fillStyle = '#464646';
            ctx.fillRect(0, SCREEN_HEIGHT / 2, SCREEN_WIDTH, SCREEN_HEIGHT / 2);

            let halfFOV = FOV / 2;
            let startAngle = player.angle - halfFOV;

            for (let ray = 0; ray < NUM_RAYS; ray++) {
                let rayAngle = startAngle + (ray / NUM_RAYS) * FOV;
                let sin = Math.sin(rayAngle), cos = Math.cos(rayAngle);

                let distance = 0;
                let hitWall = false;

                while (!hitWall && distance < MAX_DEPTH) {
                    distance += 2;
                    let testX = player.x + cos * distance;
                    let testY = player.y + sin * distance;

                    let tileX = Math.floor(testX / TILE_SIZE);
                    let tileY = Math.floor(testY / TILE_SIZE);

                    if (getTile(tileX, tileY) > 0) {
                        hitWall = true;
                    }
                }

                // Fix fish-eye
                let correctedDist = distance * Math.cos(player.angle - rayAngle);
                let wallHeight = Math.min(SCREEN_HEIGHT, (TILE_SIZE / correctedDist) * 277);

                let shade = Math.max(20, 255 - distance * 0.3);
                ctx.fillStyle = `rgb(${shade}, 0, 0)`;
                ctx.fillRect(ray, (SCREEN_HEIGHT / 2) - (wallHeight / 2), 1, wallHeight);
            }
        }

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        // Touch Control bindings
        function bindTouch(id, keyName) {
            let el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            el.addEventListener('mousedown', (e) => { keys[keyName] = true; });
            el.addEventListener('mouseup', (e) => { keys[keyName] = false; });
        }

        bindTouch('btn-up', 'w');
        bindTouch('btn-down', 's');
        bindTouch('btn-left', 'a');
        bindTouch('btn-right', 'd');
        bindTouch('btn-rot-left', 'rotL');
        bindTouch('btn-rot-right', 'rotR');

        // Keyboard backup support
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' || e.key === 'w') keys.w = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.s = true;
            if (e.key === 'ArrowLeft') keys.rotL = true;
            if (e.key === 'ArrowRight') keys.rotR = true;
            if (e.key === 'a') keys.a = true;
            if (e.key === 'd') keys.d = true;
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowUp' || e.key === 'w') keys.w = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.s = false;
            if (e.key === 'ArrowLeft') keys.rotL = false;
            if (e.key === 'ArrowRight') keys.rotR = false;
            if (e.key === 'a') keys.a = false;
            if (e.key === 'd') keys.d = false;
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
